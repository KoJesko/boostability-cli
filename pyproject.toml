[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boostability-cli"
version = "0.1.0"
description = "Turn assignments into achievable daily tasks, from the terminal."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "rich>=13.7",
]

[project.scripts]
boost = "boost.cli:main"

[tool.setuptools.packages.find]
include = ["boost*"]
